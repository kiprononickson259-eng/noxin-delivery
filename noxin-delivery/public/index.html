<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Global Delivery Services – Track your parcel</title>
  <style>
    :root { --brand: #0d3b66; --accent: #f26b21; --bg: #f4f6f8; --line: #dde2e7; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: #1b1f23; }
    header { background: var(--brand); color: #fff; padding: 18px 16px; text-align: center; }
    header h1 { margin: 0; font-size: 1.3rem; }
    header span { color: var(--accent); }
    header p { margin: 4px 0 0; font-size: .85rem; opacity: .85; }
    main { max-width: 600px; margin: 0 auto; padding: 16px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tabs button { flex: 1; background: #fff; color: var(--brand); border: 1px solid var(--line); }
    .tabs button.active { background: var(--brand); color: #fff; }
    input, select, textarea, button { font: inherit; padding: 11px; width: 100%; margin: 4px 0; border-radius: 6px; border: 1px solid var(--line); }
    button { background: var(--accent); color: #fff; border: 0; cursor: pointer; font-weight: 600; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin: 12px 0; }
    .badge { display: inline-block; background: var(--brand); color: #fff; border-radius: 20px; padding: 3px 12px; font-size: .85rem; }
    .badge.done { background: #2e7d32; }
    .event { border-left: 3px solid var(--accent); padding-left: 12px; margin: 14px 0; }
    .event small { color: #667; }
    .row { display: flex; gap: 8px; }
    .error { color: #c62828; }
    .ok { color: #2e7d32; }
    .code { font-size: 1.3rem; font-weight: 700; letter-spacing: 1px; color: var(--brand); }
    .barcode { display: block; width: min(100%, 420px); height: 100px; margin: 8px auto; }
    .barcode-label { text-align: center; font-weight: 700; letter-spacing: 1px; }
    @media print {
      body * { visibility: hidden; }
      #barcodePrint, #barcodePrint * { visibility: visible; }
      #barcodePrint { position: absolute; inset: 0; width: 100%; padding: 24px; }
      #barcodePrint button { display: none; }
    }
    .parcel { padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; font-size: .92rem; }
    .parcel:last-child { border: 0; }
    .hidden { display: none; }
    h3 { margin: 16px 0 4px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
</head>
<body>
  <header>
    <h1>Global <span>Delivery</span> Services</h1>
    <p>Parcels and cargo delivered across the world</p>
  </header>

  <main>
    <div class="tabs">
      <button id="tabTrack" class="active" onclick="showTab('track')">Track parcel</button>
      <button id="tabStaff" onclick="showTab('staff')">Staff</button>
    </div>

    <!-- CUSTOMER VIEW -->
    <section id="track">
      <input id="code" placeholder="Enter tracking number (e.g. NX-K7Q2M9XA)" />
      <button onclick="track()">Track</button>
      <div id="result"></div>
    </section>

    <!-- STAFF VIEW -->
    <section id="staff" class="hidden">
      <div id="login">
        <input id="key" type="password" placeholder="Staff key" />
        <button onclick="unlock()">Unlock</button>
        <div id="loginMsg"></div>
      </div>

      <div id="panel" class="hidden">
        <h3>Register new parcel</h3>
        <div class="card">
          <input id="tnum" placeholder="Tracking number (leave empty to auto-generate)" />
          <div class="row"><input id="sname" placeholder="Sender name" /><input id="sphone" placeholder="Sender phone" /></div>
          <div class="row"><input id="rname" placeholder="Receiver name" /><input id="rphone" placeholder="Receiver phone" /></div>
          <div class="row"><input id="origin" placeholder="From (town)" /><input id="dest" placeholder="To (town)" /></div>
          <input id="desc" placeholder="Contents (e.g. Documents, clothes)" />
          <input id="weight" type="number" step="0.1" placeholder="Weight in kg" />
          <button onclick="createParcel()">Create parcel</button>
          <div id="created"></div>
        </div>

        <h3>Add status update</h3>
        <div class="card">
          <input id="ucode" placeholder="Tracking number" />
          <select id="status"></select>
          <input id="location" placeholder="Location (e.g. Nairobi hub)" />
          <input id="note" placeholder="Note (optional)" />
          <button onclick="addEvent()">Add update</button>
          <div id="updated"></div>
        </div>

        <h3>Recent parcels</h3>
        <div class="card">
          <input id="search" placeholder="Search by number or name" oninput="loadParcels()" />
          <div id="list"></div>
        </div>
      </div>
    </section>
  </main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let staffKey = '';

function showTab(name) {
  $('track').classList.toggle('hidden', name !== 'track');
  $('staff').classList.toggle('hidden', name !== 'staff');
  $('tabTrack').classList.toggle('active', name === 'track');
  $('tabStaff').classList.toggle('active', name === 'staff');
}

function renderBarcodes(root = document) {
  root.querySelectorAll('svg[data-barcode]').forEach((svg) => {
    try {
      JsBarcode(svg, svg.dataset.barcode, {
        format: 'CODE128', displayValue: true, font: 'monospace', height: 64, margin: 8
      });
    } catch (error) {
      svg.insertAdjacentHTML('afterend', '<p class="error">Could not generate barcode.</p>');
      svg.remove();
    }
  });
}

function printBarcode() { window.print(); }

async function track() {
  const code = $('code').value.trim();
  if (!code) return;
  const res = await fetch('/api/track/' + encodeURIComponent(code));
  const d = await res.json();
  if (!res.ok) { $('result').innerHTML = `<p class="error">${esc(d.error)}</p>`; return; }
  $('result').innerHTML = `
    <div class="card">
      <div class="code">${esc(d.tracking_number)}</div>
      <svg class="barcode" data-barcode="${esc(d.tracking_number)}" aria-label="Barcode for tracking number ${esc(d.tracking_number)}"></svg>
      <p><span class="badge ${d.status === 'Delivered' ? 'done' : ''}">${esc(d.status)}</span></p>
      <p><b>${esc(d.origin)}</b> → <b>${esc(d.destination)}</b><br>
      Receiver: ${esc(d.receiver)}<br>
      ${d.description ? 'Contents: ' + esc(d.description) + '<br>' : ''}
      ${d.weight_kg ? 'Weight: ' + esc(d.weight_kg) + ' kg' : ''}</p>
    </div>
    ${d.events.map(e => `
      <div class="event">
        <b>${esc(e.status)}</b>${e.location ? ' – ' + esc(e.location) : ''}<br>
        ${e.note ? esc(e.note) + '<br>' : ''}
        <small>${esc(e.created_at)} UTC</small>
      </div>`).join('')}`;
  renderBarcodes($('result'));
}
$('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') track(); });

async function api(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: { 'Content-Type': 'application/json', 'x-api-key': staffKey },
    body: body ? JSON.stringify(body) : undefined
  });
  return { ok: res.ok, data: await res.json() };
}

async function unlock() {
  staffKey = $('key').value;
  const r = await api('GET', '/api/parcels');
  if (!r.ok) { $('loginMsg').innerHTML = `<p class="error">${esc(r.data.error)}</p>`; return; }
  $('login').classList.add('hidden');
  $('panel').classList.remove('hidden');
  const statuses = await (await fetch('/api/statuses')).json();
  $('status').innerHTML = statuses.map(s => `<option>${esc(s)}</option>`).join('');
  renderList(r.data);
}

async function loadParcels() {
  const r = await api('GET', '/api/parcels?q=' + encodeURIComponent($('search').value));
  if (r.ok) renderList(r.data);
}

function renderList(rows) {
  $('list').innerHTML = rows.length ? rows.map(p => `
    <div class="parcel" onclick="pick('${esc(p.tracking_number)}')">
      <b>${esc(p.tracking_number)}</b> · ${esc(p.status)}<br>
      ${esc(p.origin)} → ${esc(p.destination)}<br>
      <small>To: ${esc(p.receiver_name)} ${esc(p.receiver_phone)}</small>
    </div>`).join('') : '<small>No parcels yet</small>';
}

function pick(code) { $('ucode').value = code; window.scrollTo({ top: 0, behavior: 'smooth' }); }

async function createParcel() {
  const r = await api('POST', '/api/parcels', {
    tracking_number: $('tnum').value,
    sender_name: $('sname').value, sender_phone: $('sphone').value,
    receiver_name: $('rname').value, receiver_phone: $('rphone').value,
    origin: $('origin').value, destination: $('dest').value,
    description: $('desc').value, weight_kg: $('weight').value
  });
  if (r.ok) {
    $('created').innerHTML = `<div id="barcodePrint" class="card"><p class="ok">Parcel created. Tracking number:</p><div class="code">${esc(r.data.tracking_number)}</div><svg class="barcode" data-barcode="${esc(r.data.tracking_number)}" aria-label="Barcode for tracking number ${esc(r.data.tracking_number)}"></svg><div class="barcode-label">${esc(r.data.tracking_number)}</div><button type="button" onclick="printBarcode()">Print barcode</button></div>`;
    renderBarcodes($('created'));
    $('ucode').value = r.data.tracking_number;
    ['tnum','sname','sphone','rname','rphone','origin','dest','desc','weight'].forEach(id => $(id).value = '');
    loadParcels();
  } else {
    $('created').innerHTML = `<p class="error">${esc(r.data.error)}</p>`;
  }
}

async function addEvent() {
  const r = await api('POST', '/api/parcels/' + encodeURIComponent($('ucode').value.trim()) + '/events', {
    status: $('status').value, location: $('location').value, note: $('note').value
  });
  $('updated').innerHTML = r.ok ? '<p class="ok">Updated</p>' : `<p class="error">${esc(r.data.error)}</p>`;
  if (r.ok) loadParcels();
}
</script>
</body>
</html>
